name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check import diffs
        run: node --test scripts/*.test.mjs
      - name: Check the data
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/validate.mjs --base "origin/${{ github.base_ref }}"
          else
            node scripts/validate.mjs
          fi
